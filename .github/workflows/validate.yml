name: Validate README

on: [push, pull_request]

jobs:
  check-order:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - run: python check_order.py
  check-links:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: gaurav-nelson/github-action-markdown-link-check@v1
